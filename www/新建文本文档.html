<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT 边缘网关组态台 V4.3.1 (组件化终极版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
        .nested-card { border-left: 3px solid #3b82f6; }
        .custom-card { border-left: 3px solid #8b5cf6; }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen flex flex-col">
        <!-- 导航栏 -->
        <header class="bg-slate-900 text-white shadow-lg z-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <h1 class="text-xl font-bold tracking-wider">EDGE GATEWAY <span class="text-blue-400 font-light">V4.3</span></h1>
                </div>
                <div class="flex space-x-1 bg-slate-800 rounded-lg p-1">
                    <button v-for="tab in tabs" :key="tab.id" @click="currentTab = tab.id"
                        :class="['px-4 py-1.5 rounded-md text-sm font-bold transition-colors', currentTab === tab.id ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white hover:bg-slate-700']">
                        {{ tab.name }}
                    </button>
                </div>
            </div>
        </header>

        <!-- 🚀 模块化主控区：DOM 变得极其干净 -->
        <main class="flex-1 max-w-7xl mx-auto w-full p-6">
            <comp-global  v-show="currentTab === 'global'"  :cfg="cfg" :advanced-mode="advancedMode" @toggle-adv="advancedMode = !advancedMode"></comp-global>
            <comp-sensors v-show="currentTab === 'sensors'" :cfg="cfg"></comp-sensors>
            <comp-linkage v-show="currentTab === 'linkage'" :cfg="cfg"></comp-linkage>
            <comp-json    v-show="currentTab === 'json'"    :cfg="cfg" @update-cfg="applyJsonToUI"></comp-json>
        </main>
    </div>

    <!-- ======================================================================= -->
    <!-- Vue 模板化拆分区域 (Template Blocks)                                      -->
    <!-- ======================================================================= -->

    <!-- 模块 1：全局网络与硬件配置 -->
    <template id="tpl-global">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 animate-fade-in">
            <div class="flex justify-between items-center border-b pb-3 mb-5">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2"><span>🌐</span> 网关基础与 MQTT 云端接入</h2>
                <label class="flex items-center cursor-pointer gap-2 bg-gray-100 px-3 py-1.5 rounded-full border hover:bg-gray-200 transition" @click.prevent="$emit('toggle-adv')">
                    <span class="text-xs font-bold text-gray-600">开发者高级模式</span>
                    <div class="relative">
                        <div class="block bg-gray-300 w-10 h-6 rounded-full transition-colors" :class="{'bg-blue-500': advancedMode}"></div>
                        <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform" :class="{'transform translate-x-4': advancedMode}"></div>
                    </div>
                </label>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- MQTT 配置 -->
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">资产编号 (Device ID) *</label><input v-model="cfg.gateway_config.device_id" type="text" class="w-full px-3 py-2 border rounded-md outline-none focus:ring-2 focus:ring-blue-500"></div>
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">MQTT Broker 地址 *</label><input v-model="cfg.gateway_config.mqtt_broker" type="text" class="w-full px-3 py-2 border rounded-md outline-none focus:ring-2 focus:ring-blue-500"></div>
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">MQTT 登录用户名</label><input v-model="cfg.gateway_config.mqtt_user" type="text" class="w-full px-3 py-2 border rounded-md outline-none focus:ring-2 focus:ring-blue-500"></div>
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">MQTT 登录密码</label><input v-model="cfg.gateway_config.mqtt_pass" type="password" class="w-full px-3 py-2 border rounded-md outline-none focus:ring-2 focus:ring-blue-500"></div>

                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                    <label class="block text-sm font-bold text-blue-900 mb-1">定时全量快照上报周期 (ms)</label>
                    <input v-model.number="cfg.gateway_config.upload_interval_ms" type="number" class="w-full px-3 py-2 border border-blue-200 rounded-md outline-none">
                </div>
                <div class="bg-emerald-50 p-4 rounded-lg border border-emerald-100">
                    <label class="block text-sm font-bold text-emerald-900 mb-1">MQTT 下发控制主题 (Sub Topics)</label>
                    <input v-model="subTopicsStr" type="text" class="w-full px-3 py-2 border border-emerald-200 rounded-md outline-none" placeholder="逗号分隔">
                </div>

                <!-- 🚀 物理串口路由字典 (恢复角色和硬件类型修改) -->
                <div class="md:col-span-2 border-t border-gray-100 pt-5 mt-2">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-bold text-gray-800">🔌 物理串口路由字典 (Ports)</h3>
                        <button @click="addPort" class="text-xs bg-indigo-800 text-white px-2 py-1 rounded shadow hover:bg-indigo-700">+ 新增物理接口</button>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div v-for="(p, idx) in cfg.gateway_config.ports" :key="idx" class="border rounded-lg p-4 relative" :class="p.role === 0 ? 'bg-blue-50/30 border-blue-200' : 'bg-emerald-50/30 border-emerald-200'">
                            <button @click="removePort(idx)" class="absolute top-2 right-2 text-red-400 hover:text-red-600 font-bold text-lg leading-none">&times;</button>
                            
                            <div class="flex items-center justify-between mb-3 border-b pb-2">
                                <span class="text-sm font-bold text-indigo-600 bg-indigo-100 px-2 py-1 rounded border border-indigo-200">逻辑 ID: Port {{ p.port_id }}</span>
                            </div>
                            
                            <!-- 恢复下拉框修改 -->
                            <div class="grid grid-cols-2 gap-3 mb-3">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">硬件类型</label>
                                    <select v-model.number="p.hw_type" class="w-full border rounded px-2 py-1.5 text-sm outline-none bg-white">
                                        <option value="0">原生 UART</option>
                                        <option value="1">SC16IS750 (I2C扩)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">业务角色 (Role)</label>
                                    <select v-model.number="p.role" class="w-full border rounded px-2 py-1.5 text-sm outline-none font-bold" :class="p.role===0 ? 'text-blue-700 bg-blue-50' : 'text-emerald-700 bg-emerald-50'">
                                        <option value="0">南向采集 (Master)</option>
                                        <option value="1">北向被采 (Slave)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">通信波特率</label>
                                    <select v-model.number="p.baud_rate" class="w-full border rounded px-2 py-1.5 text-sm outline-none">
                                        <option value="4800">4800 bps</option><option value="9600">9600 bps</option><option value="19200">19200 bps</option><option value="115200">115200 bps</option>
                                    </select>
                                </div>
                                <div v-if="p.role === 1">
                                    <label class="block text-xs text-emerald-600 font-bold mb-1">本机响应站号</label>
                                    <input v-model.number="p.slave_id" type="number" class="w-full border border-emerald-300 bg-emerald-50 rounded px-2 py-1.5 text-sm font-bold outline-none" title="网关响应上位机的地址">
                                </div>
                            </div>

                            <!-- 深水区：物理引脚 (高级模式) -->
                            <div v-if="advancedMode" class="mt-4 pt-3 border-t border-gray-200 bg-gray-50 -mx-4 -mb-4 p-4 rounded-b-lg">
                                <div class="text-[10px] font-bold text-red-500 mb-2 uppercase tracking-wide">⚠️ 硬件底层引脚映射 (修改需对应PCB)</div>
                                <div v-if="p.hw_type === 0" class="flex gap-2">
                                    <div class="flex-1"><label class="block text-[10px] text-gray-500">UART_NUM</label><input v-model.number="p.native_uart_num" type="number" class="w-full border rounded px-1 py-1 text-xs text-center"></div>
                                    <div class="flex-1"><label class="block text-[10px] text-gray-500">TX 引脚</label><input v-model.number="p.tx_pin" type="number" class="w-full border rounded px-1 py-1 text-xs text-center"></div>
                                    <div class="flex-1"><label class="block text-[10px] text-gray-500">RX 引脚</label><input v-model.number="p.rx_pin" type="number" class="w-full border rounded px-1 py-1 text-xs text-center"></div>
                                    <div class="flex-1"><label class="block text-[10px] text-gray-500">DIR(DE) 引脚</label><input v-model.number="p.rts_pin" type="number" class="w-full border rounded px-1 py-1 text-xs text-center"></div>
                                </div>
                                <div v-else>
                                    <label class="block text-[10px] text-gray-500">I2C 十进制地址</label>
                                    <input v-model.number="p.i2c_addr" type="number" class="w-1/3 border rounded px-2 py-1 text-xs">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 本地物理测点 -->
                    <div class="md:col-span-2 border-t border-gray-100 pt-5 mt-2">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2"><span>🎛️</span> 本地物理/系统测点高级配置 (GPIO/ADC)</h3>
                            <button @click="addLocalTag" class="text-xs bg-gray-800 text-white px-2 py-1 rounded shadow hover:bg-gray-700">+ 新增本地测点</button>
                        </div>
                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 overflow-x-auto">
                            <table class="w-full text-sm text-left">
                                <thead class="text-xs text-gray-500 uppercase bg-gray-100 border-b">
                                    <tr>
                                        <th class="px-3 py-2 w-32">系统 Tag ID</th>
                                        <th class="px-3 py-2 w-24 text-center">开启掉电记忆</th>
                                        <th class="px-3 py-2 w-32">缩放倍率 (Scale)</th>
                                        <th class="px-3 py-2 w-32">线性偏移 (Offset)</th>
                                        <th class="px-3 py-2 w-16 text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="(lt, idx) in cfg.gateway_config.local_tags" :key="idx" class="border-b bg-white hover:bg-gray-50">
                                        <td class="px-3 py-2"><input v-model.number="lt.tag_id" type="number" class="w-full px-2 py-1 border rounded text-xs outline-none"></td>
                                        <td class="px-3 py-2 text-center"><input type="checkbox" v-model="lt.persist" class="w-4 h-4 text-blue-600 rounded cursor-pointer"></td>
                                        <td class="px-3 py-2"><input v-model.number="lt.scale" type="number" step="0.001" class="w-full px-2 py-1 border rounded text-xs outline-none"></td>
                                        <td class="px-3 py-2"><input v-model.number="lt.offset" type="number" step="0.001" class="w-full px-2 py-1 border rounded text-xs outline-none"></td>
                                        <td class="px-3 py-2 text-center"><button @click="removeLocalTag(idx)" class="text-red-500 font-bold text-lg hover:text-red-700">&times;</button></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- 模块 2：传感器与指令组字典 -->
    <template id="tpl-sensors">
        <div class="flex gap-6 h-[80vh]">
            <div class="w-1/3 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
                <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                    <h3 class="font-bold text-gray-700">设备挂载清单</h3>
                    <button @click="addSensor" class="bg-blue-600 text-white px-3 py-1.5 rounded-md text-xs font-bold shadow hover:bg-blue-700">+ 新增设备</button>
                </div>
                <div class="flex-1 overflow-y-auto p-2 space-y-2 no-scrollbar">
                    <div v-for="(sensor, idx) in cfg.sensors" :key="idx" @click="activeIdx = idx"
                        :class="['p-3 rounded-lg border cursor-pointer transition-all', activeIdx === idx ? 'border-blue-500 bg-blue-50 shadow-sm' : 'border-gray-200 hover:bg-gray-50']">
                        <div class="flex justify-between items-start">
                            <div class="font-bold text-gray-800">{{ sensor.name || '未命名' }}</div>
                            <button @click.stop="removeSensor(idx)" class="text-red-400 hover:text-red-600 font-bold text-xs">删除</button>
                        </div>
                        <div class="text-[10px] text-gray-500 mt-2 flex flex-wrap gap-2">
                            <span class="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded">{{ sensor.transport === 0 ? 'Port '+sensor.bind_port_id : 'TCP/IP' }}</span>
                            <span class="bg-gray-200 text-gray-700 px-1.5 py-0.5 rounded">协议: {{ sensor.protocol }}</span>
                            <span v-if="sensor.slave_id" class="bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded">从机号: {{ sensor.slave_id }}</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="w-2/3 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden" v-if="activeIdx !== null && cfg.sensors[activeIdx]">
                <div class="p-4 border-b bg-gray-50"><h3 class="font-bold text-gray-700">⚙️ 节点基础通讯参数</h3></div>
                <div class="p-5 border-b">
                    <div class="grid grid-cols-4 gap-4">
                        <div class="col-span-2"><label class="block text-xs font-semibold text-gray-600 mb-1">设备业务名称</label><input v-model="cfg.sensors[activeIdx].name" type="text" class="w-full px-2 py-1.5 border rounded text-sm outline-none"></div>
                        
                        <div><label class="block text-xs font-semibold text-gray-600 mb-1">通信链路 (Transport)</label>
                            <select v-model.number="cfg.sensors[activeIdx].transport" class="w-full px-2 py-1.5 border rounded text-sm font-bold text-blue-700 bg-blue-50 outline-none">
                                <option value="0">本地串口 (RS485)</option><option value="1">以太网 TCP</option><option value="2">Wi-Fi 网络</option>
                            </select>
                        </div>
                        <div v-if="cfg.sensors[activeIdx].transport === 0">
                            <label class="block text-xs font-semibold text-gray-600 mb-1">挂载逻辑接口</label>
                            <select v-model.number="cfg.sensors[activeIdx].bind_port_id" class="w-full px-2 py-1.5 border rounded text-sm outline-none font-bold text-indigo-700 bg-indigo-50">
                                <option v-for="p in cfg.gateway_config.ports" :key="p.port_id" :value="p.port_id" v-show="p.role === 0">挂载至 Port {{ p.port_id }}</option>
                            </select>
                        </div>
                        <div v-else class="col-span-1">
                            <label class="block text-xs font-semibold text-gray-600 mb-1">目标 IP</label>
                            <input v-model="cfg.sensors[activeIdx].target_ip" type="text" class="w-full px-2 py-1.5 border rounded text-sm outline-none">
                        </div>
                        
                        <div><label class="block text-xs font-semibold text-gray-600 mb-1">目标从机站号 (Slave ID)</label><input v-model.number="cfg.sensors[activeIdx].slave_id" type="number" class="w-full px-2 py-1.5 border rounded text-sm outline-none"></div>
                        <div><label class="block text-xs font-semibold text-gray-600 mb-1">健康状态 Tag ID</label><input v-model.number="cfg.sensors[activeIdx].status_tag_id" type="number" class="w-full px-2 py-1.5 border rounded text-sm outline-none bg-emerald-50"></div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">协议规范 (Protocol)</label>
                            <select v-model.number="cfg.sensors[activeIdx].protocol" class="w-full px-2 py-1.5 border rounded text-sm outline-none font-bold text-gray-700">
                                <option value="0">Modbus RTU</option><option value="1">Modbus TCP</option><option value="2">非标自定义</option><option value="3">C语言定制</option>
                            </select>
                        </div>
                        <div><label class="block text-xs font-semibold text-gray-600 mb-1">轮询间隔 (ms)</label><input v-model.number="cfg.sensors[activeIdx].poll_interval_ms" type="number" class="w-full px-2 py-1.5 border rounded text-sm outline-none"></div>
                    </div>
                </div>

                <!-- 指令组集群 -->
                <div class="flex-1 overflow-y-auto p-5 bg-slate-50 no-scrollbar">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="font-bold text-gray-700">📦 轮询指令簇 (Command Clusters)</h4>
                        <button @click="addCommand" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded text-xs shadow">+ 添加查询指令</button>
                    </div>

                    <div v-for="(cmd, cIdx) in cfg.sensors[activeIdx].commands" :key="cIdx" class="bg-white border rounded-lg mb-4 shadow-sm" :class="cfg.sensors[activeIdx].protocol === 2 ? 'custom-card border-purple-200' : 'nested-card border-blue-200'">
                        
                        <!-- 标准协议头部 -->
                        <div v-if="cfg.sensors[activeIdx].protocol <= 1" class="bg-blue-50 p-3 border-b border-blue-100 flex justify-between items-center">
                            <div class="flex gap-4 items-center">
                                <span class="font-bold text-blue-800 text-sm">指令 #{{ cIdx + 1 }}</span>
                                <div class="flex items-center gap-2"><span class="text-xs font-bold text-gray-600">功能码:</span><select v-model.number="cmd.func_code" class="border rounded px-1 py-0.5 text-xs bg-white outline-none"><option value="3">03 (读保持)</option><option value="4">04 (读输入)</option></select></div>
                                <div class="flex items-center gap-2"><span class="text-xs font-bold text-gray-600">起始地址:</span><input v-model.number="cmd.start_reg" type="number" class="w-16 border rounded px-1 py-0.5 text-xs text-center outline-none"></div>
                                <div class="flex items-center gap-2"><span class="text-xs font-bold text-gray-600">读取数量:</span><input v-model.number="cmd.reg_count" type="number" class="w-16 border rounded px-1 py-0.5 text-xs text-center outline-none"></div>
                            </div>
                            <button @click="removeCommand(cIdx)" class="text-red-500 font-bold text-lg leading-none hover:text-red-700">&times;</button>
                        </div>
                        
                        <!-- 非标协议头部 -->
                        <div v-else-if="cfg.sensors[activeIdx].protocol === 2" class="bg-purple-50 p-3 border-b border-purple-100 flex flex-col gap-2 relative">
                            <button @click="removeCommand(cIdx)" class="absolute top-2 right-2 text-red-500 font-bold text-lg leading-none hover:text-red-700">&times;</button>
                            <div class="font-bold text-purple-800 text-sm">非标自定义指令 #{{ cIdx + 1 }}</div>
                            <div class="flex gap-4 items-center">
                                <div class="flex-1 flex items-center gap-2">
                                    <span class="text-xs font-bold text-gray-600 w-24">主动发送 Hex:</span>
                                    <input v-model="cmd.custom_req_hex" type="text" class="w-full border border-purple-300 rounded px-2 py-1 text-xs outline-none font-mono">
                                </div>
                            </div>
                            <div class="flex gap-4 items-center mt-1">
                                <div class="flex items-center gap-2"><span class="text-xs font-bold text-gray-600 w-24">接收截断模式:</span><select v-model.number="cmd.custom_rx_mode" class="border border-purple-300 rounded px-2 py-1 text-xs bg-white outline-none"><option value="0">定长截断</option><option value="1">帧头匹配</option></select></div>
                                <div class="flex items-center gap-2" v-if="cmd.custom_rx_mode === 0"><span class="text-xs font-bold text-gray-600">固定长度:</span><input v-model.number="cmd.custom_rx_len" type="number" class="w-16 border border-purple-300 rounded px-2 py-1 text-xs text-center"></div>
                                <div class="flex items-center gap-2" v-if="cmd.custom_rx_mode === 1"><span class="text-xs font-bold text-gray-600">匹配帧头 Hex:</span><input v-model="cmd.custom_rx_header" type="text" class="w-24 border border-purple-300 rounded px-2 py-1 text-xs font-mono"></div>
                            </div>
                        </div>

                        <!-- 规则映射字典 -->
                        <div class="p-3">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-gray-500 uppercase">返回数据切片字典 (Rules)</span>
                                <button @click="addRule(cIdx)" class="text-xs bg-emerald-100 text-emerald-700 font-bold px-2 py-1 rounded hover:bg-emerald-200">+ 新增切片</button>
                            </div>
                            <table class="min-w-full text-xs text-left border rounded">
                                <thead class="bg-gray-50 text-gray-500">
                                    <tr>
                                        <th class="px-2 py-1.5 font-semibold">业务名称</th><th class="px-2 py-1.5 font-semibold">虚拟 Tag ID</th>
                                        <th class="px-2 py-1.5 font-semibold">偏移(Byte)</th><th class="px-2 py-1.5 font-semibold">数据格式</th>
                                        <th class="px-2 py-1.5 font-semibold text-center">读写控制</th><th class="px-2 py-1.5"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="(rule, rIdx) in cmd.rules" :key="rIdx" class="hover:bg-gray-50 border-t">
                                        <td class="px-2 py-1.5"><input v-model="rule.name" type="text" class="w-20 px-1 py-1 border rounded outline-none"></td>
                                        <td class="px-2 py-1.5"><input v-model.number="rule.target_tag_id" type="number" class="w-16 px-1 py-1 border rounded text-center outline-none font-bold text-indigo-600"></td>
                                        <td class="px-2 py-1.5"><input v-model.number="rule.offset" type="number" class="w-12 px-1 py-1 border rounded text-center outline-none"></td>
                                        <td class="px-2 py-1.5">
                                            <select v-model.number="rule.type" class="w-24 px-1 py-1 border rounded outline-none bg-white">
                                                <option value="0">U16_AB</option><option value="1">U16_BA</option><option value="2">I16_AB</option><option value="4">U32_ABCD</option><option value="10">F32_ABCD</option>
                                            </select>
                                        </td>
                                        <td class="px-2 py-1.5">
                                            <div class="flex items-center justify-center gap-1">
                                                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" v-model="rule.writable">写</label>
                                                <template v-if="rule.writable">
                                                    <select v-model.number="rule.write_func" class="w-12 border rounded py-0.5 bg-indigo-50 text-indigo-700"><option value="6">06</option><option value="16">10</option></select>
                                                    <input v-model.number="rule.reverse_reg" type="number" class="w-14 border rounded py-0.5 text-center" placeholder="地址">
                                                </template>
                                            </div>
                                        </td>
                                        <td class="px-2 py-1.5 text-center"><button @click="removeRule(cIdx, rIdx)" class="text-red-400 font-bold hover:text-red-600 text-lg leading-none">&times;</button></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- 模块 3：边缘联动计算 -->
    <template id="tpl-linkage">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 h-[80vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2"><span>⚡</span> 边缘计算与控制联动 (Soft-PLC)</h2>
                <button @click="addLinkage" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-md text-sm font-bold shadow">+ 新增逻辑块</button>
            </div>
            <div class="flex-1 overflow-y-auto pr-2 space-y-4">
                <div v-for="(lk, idx) in cfg.linkage_rules" :key="idx" class="p-4 border rounded-lg bg-gray-50 flex flex-col gap-3 relative hover:shadow">
                    <button @click="removeLinkage(idx)" class="absolute top-2 right-2 text-gray-400 hover:text-red-600 font-bold px-2 text-lg leading-none">&times;</button>
                    <div class="flex items-center gap-4">
                        <label class="flex items-center gap-2 w-1/3 cursor-pointer"><input type="checkbox" v-model="lk.enable" class="w-4 h-4 text-indigo-600 rounded"><span class="text-sm font-bold text-gray-600">启用</span>
                        <input type="text" v-model="lk.name" placeholder="业务规则名称" class="w-full px-2 py-1 border rounded text-sm font-bold text-indigo-700 outline-none"></label>
                    </div>
                    <div class="grid grid-cols-12 gap-4 items-end text-sm">
                        <div class="col-span-6"><label class="block text-xs font-semibold text-gray-600 mb-1">触发条件 (Expression)</label><input type="text" v-model="lk.condition" class="w-full px-3 py-1.5 border rounded font-mono text-blue-700 outline-none"></div>
                        <div class="col-span-3"><label class="block text-xs font-semibold text-gray-600 mb-1">动作: 写入 Tag ID</label><input type="number" v-model.number="lk.action_tag_id" class="w-full px-2 py-1.5 border rounded text-center outline-none"></div>
                        <div class="col-span-3"><label class="block text-xs font-semibold text-gray-600 mb-1">写入数值</label><input type="number" step="0.01" v-model.number="lk.action_value" class="w-full px-2 py-1.5 border rounded text-center outline-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- 模块 4：JSON 同步 -->
    <template id="tpl-json">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 h-[80vh] flex flex-col">
            <div class="flex justify-between mb-3">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2"><span>📄</span> 架构底层编译源码 (JSON)</h2>
                <div class="flex gap-3">
                    <button @click="applyJson" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-md text-sm font-bold shadow">🔄 从源码应用至 UI</button>
                    <button @click="downloadJson" class="bg-emerald-600 text-white px-4 py-1.5 rounded-md text-sm font-bold shadow">⬇️ 下载当前 JSON</button>
                </div>
            </div>
            <textarea v-model="localText" class="flex-1 w-full bg-slate-900 text-green-400 font-mono text-sm p-4 rounded-lg outline-none resize-none"></textarea>
        </div>
    </template>

    <!-- ======================================================================= -->
    <!-- Vue 组件化注册与实例逻辑                                                  -->
    <!-- ======================================================================= -->
    <script>
        const { createApp } = Vue;
        
        const app = createApp({
            data() {
                return {
                    currentTab: 'global',
                    advancedMode: false,
                    tabs: [ { id: 'global', name: '网关硬件映射' }, { id: 'sensors', name: '设备与指令字典' }, { id: 'linkage', name: '边缘控制联动' }, { id: 'json', name: '底层编译源码' } ],
                    cfg: {
                        version: "4.3.1",
                        gateway_config: {
                            device_id: "GW_ESP32S3_001", mqtt_broker: "mqtt://broker.emqx.io", mqtt_user: "admin", mqtt_pass: "public", upload_interval_ms: 5000, sub_topics: ["/gw/ctrl"],
                            ports: [
                                { port_id: 1, hw_type: 0, role: 0, baud_rate: 9600, native_uart_num: 1, tx_pin: 17, rx_pin: 18, rts_pin: 8 },
                                { port_id: 2, hw_type: 1, role: 1, baud_rate: 115200, i2c_addr: 77, slave_id: 1 }
                            ],
                            local_tags: [{ tag_id: 501, persist: true, scale: 1.0, offset: 0.0 }]
                        },
                        sensors: [{
                            name: "汇控IO模块_示例", transport: 0, bind_port_id: 1, protocol: 0, target_ip: "", slave_id: 1, poll_interval_ms: 1000, timeout_ms: 500, status_tag_id: 2001,
                            commands: [
                                { func_code: 3, start_reg: 0, reg_count: 4, rules: [{ name: "DO_1", target_tag_id: 2002, offset: 0, type: 0, scale: 1.0, writable: true, write_func: 6, reverse_reg: 0, persist: false }] },
                                { func_code: 4, start_reg: 0, reg_count: 4, rules: [{ name: "DI_1", target_tag_id: 2006, offset: 0, type: 0, scale: 1.0, writable: false, persist: false }] }
                            ]
                        }],
                        linkage_rules: [{ name: "联动告警", enable: true, condition: "TAG(2006) == 1", action_tag_id: 501, action_value: 1.0 }]
                    }
                }
            },
            methods: {
                applyJsonToUI(newCfgText) {
                    try { this.cfg = JSON.parse(newCfgText); alert("解析成功并同步!"); } 
                    catch (e) { alert("JSON 语法错误:\n" + e.message); }
                }
            }
        });

        // 注册子组件：Global
        app.component('comp-global', {
            template: '#tpl-global', props: ['cfg', 'advancedMode'],
            computed: {
                subTopicsStr: {
                    get() { return this.cfg.gateway_config.sub_topics ? this.cfg.gateway_config.sub_topics.join(', ') : ''; },
                    set(val) { this.cfg.gateway_config.sub_topics = val.split(',').map(s => s.trim()).filter(s => s); }
                }
            },
            methods: {
                addPort() { this.cfg.gateway_config.ports.push({ port_id: this.cfg.gateway_config.ports.length + 1, hw_type: 0, role: 0, baud_rate: 9600, native_uart_num: 1, tx_pin: 1, rx_pin: 2, rts_pin: 3, slave_id: 1 }); },
                removePort(idx) { this.cfg.gateway_config.ports.splice(idx, 1); },
                addLocalTag() { this.cfg.gateway_config.local_tags.push({ tag_id: 500, persist: false, scale: 1.0, offset: 0.0 }); },
                removeLocalTag(idx) { this.cfg.gateway_config.local_tags.splice(idx, 1); }
            }
        });

        // 注册子组件：Sensors
        app.component('comp-sensors', {
            template: '#tpl-sensors', props: ['cfg'],
            data() { return { activeIdx: 0 } },
            methods: {
                addSensor() { this.cfg.sensors.push({ name: "New_Device", transport: 0, bind_port_id: 1, protocol: 0, slave_id: 1, poll_interval_ms: 1000, timeout_ms: 500, status_tag_id: 0, commands: [{ func_code: 3, start_reg: 0, reg_count: 1, rules: [] }] }); this.activeIdx = this.cfg.sensors.length - 1; },
                removeSensor(idx) { this.cfg.sensors.splice(idx, 1); this.activeIdx = this.cfg.sensors.length > 0 ? 0 : null; },
                addCommand() { let c = { func_code: 3, start_reg: 0, reg_count: 1, rules: [] }; if(this.cfg.sensors[this.activeIdx].protocol===2) c = { custom_req_hex: "AA BB", custom_rx_mode: 0, custom_rx_len: 8, custom_rx_header: "", rules: [] }; this.cfg.sensors[this.activeIdx].commands.push(c); },
                removeCommand(cIdx) { this.cfg.sensors[this.activeIdx].commands.splice(cIdx, 1); },
                addRule(cIdx) { this.cfg.sensors[this.activeIdx].commands[cIdx].rules.push({ name: "val", target_tag_id: 3000, offset: 0, type: 0, scale: 1.0, writable: false, write_func: 6, reverse_reg: 0, persist: false }); },
                removeRule(cIdx, rIdx) { this.cfg.sensors[this.activeIdx].commands[cIdx].rules.splice(rIdx, 1); }
            }
        });

        // 注册子组件：Linkage
        app.component('comp-linkage', {
            template: '#tpl-linkage', props: ['cfg'],
            methods: {
                addLinkage() { this.cfg.linkage_rules.push({ name: "Logic_" + (this.cfg.linkage_rules.length + 1), enable: true, condition: "", action_tag_id: 0, action_value: 0.0 }); },
                removeLinkage(idx) { this.cfg.linkage_rules.splice(idx, 1); }
            }
        });

        // 注册子组件：JSON
        app.component('comp-json', {
            template: '#tpl-json', props: ['cfg'],
            data() { return { localText: '' } },
            watch: { cfg: { handler(v) { this.localText = JSON.stringify(v, null, 4); }, deep: true, immediate: true } },
            methods: {
                applyJson() { this.$emit('update-cfg', this.localText); },
                downloadJson() {
                    const dl = document.createElement('a'); dl.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(this.localText));
                    dl.setAttribute("download", "sensors.json"); document.body.appendChild(dl); dl.click(); dl.remove();
                }
            }
        });

        app.mount('#app');
    </script>
</body>
</html>
